<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="用一组好问题，把模糊困扰变成清晰行动。">
  <title>Clarify｜想清楚再行动</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23121825'/%3E%3Cpath d='M20 35c0-12 6-19 17-19 5 0 9 2 12 5l-7 8c-1-2-3-3-5-3-4 0-6 3-6 9s2 9 7 9c2 0 4-1 6-3l6 8c-3 3-8 5-13 5-11 0-17-7-17-19Z' fill='%23ffcf56'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#10131a;--muted:#6e7180;--paper:#f6f2e9;--card:#fffdfa;--line:#ddd7ca;--accent:#ffcf56;--accent2:#ee694d;--deep:#121825;--ok:#2b7a63;--shadow:0 18px 60px rgba(25,27,32,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
    button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px;font-weight:760;letter-spacing:-.02em}.mark{width:34px;height:34px;border-radius:11px;background:var(--deep);color:var(--accent);display:grid;place-items:center;font-weight:900}.tag{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.45)}
    main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}.stage{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,58px);min-height:620px;position:relative;overflow:hidden}.stage:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:var(--accent);filter:blur(90px);opacity:.15;right:-80px;top:-80px;pointer-events:none}
    .eyebrow{font-size:13px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:18px}.title{font-size:clamp(38px,6vw,68px);line-height:1.05;letter-spacing:-.055em;margin:0 0 20px;max-width:720px}.lead{font-size:18px;line-height:1.75;color:var(--muted);max-width:620px;margin:0 0 34px}.inputbox{position:relative}.inputbox textarea{width:100%;min-height:140px;resize:vertical;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:20px 20px 58px;outline:none;line-height:1.65;transition:.2s}.inputbox textarea:focus{border-color:var(--deep);box-shadow:0 0 0 4px rgba(18,24,37,.06)}.count{position:absolute;right:18px;bottom:18px;color:var(--muted);font-size:13px}
    .actions{display:flex;gap:12px;align-items:center;margin-top:16px}.primary,.secondary{border:0;border-radius:14px;padding:14px 18px;font-weight:720}.primary{background:var(--deep);color:#fff}.primary:hover{transform:translateY(-1px)}.primary:disabled{opacity:.38;cursor:not-allowed}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
    aside{display:flex;flex-direction:column;gap:16px}.sidecard{border:1px solid var(--line);border-radius:20px;padding:22px;background:rgba(255,255,255,.5)}.sidecard h3{margin:0 0 14px;font-size:15px}.sidecard p,.sidecard li{font-size:14px;line-height:1.65;color:var(--muted)}.sidecard ol{padding-left:20px;margin:0}.privacy{margin-top:auto}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px}
    .progress{height:6px;background:#ece7dc;border-radius:99px;overflow:hidden;margin-bottom:34px}.progress span{display:block;height:100%;background:var(--accent2);transition:width .35s}.stepmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}.question{font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:-.035em;margin:0 0 12px}.hint{color:var(--muted);line-height:1.6;margin-bottom:28px}.choices{display:grid;gap:12px}.choice{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;text-align:left;transition:.18s;line-height:1.5}.choice:hover,.choice.selected{border-color:var(--deep);box-shadow:4px 4px 0 var(--accent)}
    .result-head{display:flex;gap:18px;align-items:center;margin-bottom:30px}.score{min-width:84px;height:84px;border-radius:25px;background:var(--deep);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:820;transform:rotate(-3deg)}.result-head h1{margin:0 0 7px;font-size:34px;letter-spacing:-.04em}.result-head p{margin:0;color:var(--muted)}.summary{font-size:18px;line-height:1.75;background:#fff7dd;border-left:5px solid var(--accent);padding:18px 20px;border-radius:0 16px 16px 0;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.result-card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff}.result-card h3{margin:0 0 12px;font-size:15px}.result-card ul{margin:0;padding-left:20px;color:var(--muted);line-height:1.7}.plan{grid-column:1/-1}.day{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.day:last-child{border-bottom:0}.day b{color:var(--accent2)}.api-panel{margin-top:24px;border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-size:14px}.api-panel summary{cursor:pointer;color:var(--ink);font-weight:700}.api-row{display:flex;gap:8px;margin-top:12px}.api-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;background:white;min-width:0}.tiny{font-size:12px;margin:8px 0 0}.hidden{display:none!important}.fade{animation:fade .38s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:26px}
    @media(max-width:820px){main{grid-template-columns:1fr}.stage{min-height:auto}aside{display:grid;grid-template-columns:1fr 1fr}.privacy{margin:0}.title{font-size:44px}}
    @media(max-width:560px){.shell{padding:16px}header{margin-bottom:24px}.tag{display:none}.stage{border-radius:22px;padding:26px 20px}.title{font-size:39px}.lead{font-size:16px}.grid,aside{grid-template-columns:1fr}.result-head{align-items:flex-start}.score{min-width:70px;height:70px}.api-row{flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><span class="mark">C</span><span>Clarify</span></div><span class="tag">本地分析 · 无需注册</span></header>
  <main>
    <section class="stage" id="stage"></section>
    <aside>
      <div class="sidecard"><h3>它会怎样帮你</h3><ol><li>把模糊困扰说清楚</li><li>识别目标、限制与风险</li><li>给出小而具体的下一步</li></ol></div>
      <div class="sidecard privacy"><h3><span class="dot"></span>隐私友好</h3><p>默认在你的浏览器中完成分析，不上传回答。API 增强功能完全可选。</p></div>
    </aside>
  </main>
  <footer>Clarify 不替你做决定，它帮你看见决定。</footer>
</div>
<script>
const stage=document.querySelector('#stage');
const questions=[
 {q:'如果这件事顺利解决，最理想的结果是什么？',h:'先定义“变好”是什么，而不是急着寻找答案。',type:'text',ph:'例如：三个月内找到更有成长空间、但加班更少的工作……'},
 {q:'现在最卡住你的是什么？',h:'选择最接近的一项。',type:'choice',opts:['信息不够，不知道怎么判断','选项太多，很难取舍','担心失败或后悔','时间、金钱或他人的限制']},
 {q:'你最看重哪一个判断标准？',h:'当所有条件无法同时满足时，它是你的优先级。',type:'choice',opts:['长期成长','稳定和安全感','当下体验与幸福感','回报与实际收益']},
 {q:'如果保持现状三个月，会发生什么？',h:'变化有成本，不变化也有成本。',type:'text',ph:'描述最可能出现的结果……'},
 {q:'你能接受多大的试错成本？',h:'这决定下一步应该是大胆行动，还是低成本验证。',type:'choice',opts:['很低：只能做安全的小尝试','中等：可以投入一些时间或金钱','较高：愿意承担明显的不确定性']},
 {q:'现在就能做的最小行动是什么？',h:'不用完美，只要能让你获得新信息。',type:'text',ph:'例如：约一位业内朋友聊 20 分钟……'}
];
let state={topic:'',step:0,answers:[]};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function home(){stage.className='stage fade';stage.innerHTML=`<div class="eyebrow">A thinking companion</div><h1 class="title">把模糊的困扰，<br>变成清晰的行动。</h1><p class="lead">写下一件正在困扰你的事。Clarify 会用 6 个问题帮你看清目标、限制与下一步。</p><div class="inputbox"><textarea id="topic" maxlength="240" placeholder="例如：我收到了一份新工作邀请，但不知道该不该接受……"></textarea><span class="count"><b id="n">0</b>/240</span></div><div class="actions"><button class="primary" id="start" disabled>开始梳理</button><button class="secondary" id="demo">填入示例</button></div>`;let t=stage.querySelector('#topic'),b=stage.querySelector('#start');t.oninput=()=>{stage.querySelector('#n').textContent=t.value.length;b.disabled=t.value.trim().length<8};stage.querySelector('#demo').onclick=()=>{t.value='我想利用业余时间做一个副业项目，但担心投入很多时间却没有结果。';t.oninput()};b.onclick=()=>{state={topic:t.value.trim(),step:0,answers:[]};ask()}}
function ask(){let x=questions[state.step],pct=(state.step/questions.length)*100;stage.className='stage fade';stage.innerHTML=`<div class="stepmeta"><span>问题 ${state.step+1} / ${questions.length}</span><span>${Math.round(pct)}%</span></div><div class="progress"><span style="width:${pct}%"></span></div><h2 class="question">${x.q}</h2><p class="hint">${x.h}</p>${x.type==='text'?`<div class="inputbox"><textarea id="answer" maxlength="360" placeholder="${x.ph}"></textarea><span class="count"><b id="n">0</b>/360</span></div>`:`<div class="choices">${x.opts.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join('')}</div>`}<div class="actions"><button class="primary" id="next" disabled>${state.step===questions.length-1?'生成行动建议':'继续'}</button>${state.step?'<button class="secondary" id="back">上一步</button>':''}</div>`;
 let value='';if(x.type==='text'){let a=stage.querySelector('#answer');a.oninput=()=>{value=a.value.trim();stage.querySelector('#n').textContent=a.value.length;stage.querySelector('#next').disabled=value.length<3}}else{stage.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{stage.querySelectorAll('.choice').forEach(v=>v.classList.remove('selected'));btn.classList.add('selected');value=x.opts[+btn.dataset.i];stage.querySelector('#next').disabled=false})}stage.querySelector('#next').onclick=()=>{state.answers[state.step]=value;state.step++;state.step<questions.length?ask():result()};let back=stage.querySelector('#back');if(back)back.onclick=()=>{state.step--;ask()}}
function result(){let a=state.answers,block=a[1],priority=a[2],risk=a[4],action=a[5];let mode=risk.startsWith('很低')?'低成本验证':risk.startsWith('较高')?'快速试验':'分阶段试验';let score=block.includes('信息')?68:block.includes('选项')?74:block.includes('担心')?63:70;let risks=block.includes('担心')?['把一次尝试误认为最终承诺','用想象中的失败代替真实反馈']:block.includes('信息')?['继续收集大量但无关的信息','没有明确停止调研的标准']:['把所有因素放在同一优先级','因追求完美方案而延迟行动'];stage.className='stage fade';stage.innerHTML=`<div class="result-head"><div class="score">${score}%</div><div><h1>你已经更接近答案了</h1><p>清晰度估计 · 基于你的回答</p></div></div><div class="summary">你真正要解决的，不只是“${esc(state.topic)}”，而是如何在<strong>${esc(priority)}</strong>和现实限制之间，做一次可逆、可验证的选择。</div><div class="grid"><div class="result-card"><h3>建议策略</h3><ul><li>采用「${mode}」而非一次性决定</li><li>先验证最关键的未知条件</li><li>为试验设定明确结束时间</li></ul></div><div class="result-card"><h3>需要留意</h3><ul>${risks.map(r=>`<li>${r}</li>`).join('')}<li>保持现状的代价：${esc(a[3])}</li></ul></div><div class="result-card plan"><h3>你的 7 天行动计划</h3><div class="day"><b>今天</b><span>${esc(action)}</span></div><div class="day"><b>第 2 天</b><span>写下支持与反对这个选择的各 3 条证据，只记录事实。</span></div><div class="day"><b>第 3–5 天</b><span>完成一次低成本试验，专门验证最不确定的条件。</span></div><div class="day"><b>第 7 天</b><span>根据新信息复盘：继续、调整，或停止。</span></div></div></div><details class="api-panel"><summary>API 增强模式（可选）</summary><div class="api-row"><input type="password" placeholder="输入兼容服务的 API Key（仅当前页面使用）"><button class="secondary" onclick="alert('演示版已预留接口配置；部署自己的服务端代理后即可启用动态追问。')">连接</button></div><p class="tiny">为保护密钥，正式接入时建议通过服务端代理调用；当前免费模式不需要密钥。</p></details><div class="actions"><button class="primary" id="again">梳理另一个问题</button><button class="secondary" id="copy">复制结果</button></div>`;stage.querySelector('#again').onclick=home;stage.querySelector('#copy').onclick=async()=>{let text=`Clarify 思考结果\n问题：${state.topic}\n核心标准：${priority}\n建议：采用${mode}\n第一步：${action}`;await navigator.clipboard.writeText(text);stage.querySelector('#copy').textContent='已复制'}}
home();
</script>
</body>
</html>
