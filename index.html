<style>
.tag{display:none!important}
:root{--ink:#12211b;--muted:#68766f;--paper:#f3f5ef;--card:#fff;--line:#d9dfd8;--lime:#c8f45b;--orange:#ff7849;--deep:#15392d;--shadow:0 20px 60px #163b2a18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#dff5cf 0,transparent 34%),var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:38px;height:38px;border-radius:12px;background:var(--deep);color:var(--lime);display:grid;place-items:center}.tag,.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:7px 11px;background:#ffffffaa;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.stage{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,54px);min-height:650px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:16px}.title{font-size:clamp(40px,6vw,67px);line-height:1.04;letter-spacing:-.055em;margin:0 0 20px}.lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:650px}.benefits{display:flex;flex-wrap:wrap;gap:9px;margin:25px 0}.benefits span{background:#eff8d9;border-radius:99px;padding:9px 12px;font-size:13px}.inputbox{position:relative}.inputbox textarea,.field{width:100%;border:1.5px solid var(--line);border-radius:17px;background:#fff;padding:17px;outline:none}.inputbox textarea{min-height:130px;resize:vertical;padding-bottom:42px}.inputbox textarea:focus,.field:focus{border-color:var(--deep);box-shadow:0 0 0 4px #15392d12}.count{position:absolute;right:16px;bottom:15px;color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.primary,.secondary,.ghost{border:0;border-radius:13px;padding:13px 17px;font-weight:750}.primary{background:var(--deep);color:#fff}.primary:disabled{opacity:.35}.secondary{background:var(--lime);color:var(--deep)}.ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}aside{display:flex;flex-direction:column;gap:14px}.sidecard{border:1px solid var(--line);border-radius:19px;padding:20px;background:#ffffffa8}.sidecard h3{margin:0 0 12px;font-size:15px}.sidecard p,.sidecard li{font-size:13px;line-height:1.65;color:var(--muted)}.sidecard ol{padding-left:18px;margin:0}.steps{display:flex;gap:5px;margin-bottom:32px}.steps i{height:7px;flex:1;border-radius:9px;background:#e8ece5}.steps i.on{background:var(--orange)}.stepmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}.question{font-size:clamp(29px,4vw,43px);line-height:1.18;letter-spacing:-.035em;margin:0 0 10px}.hint{color:var(--muted);line-height:1.65;margin:0 0 24px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{border:1.5px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;line-height:1.45}.choice:hover,.choice.selected{border-color:var(--deep);box-shadow:4px 4px 0 var(--lime)}.resultTop{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:24px}.resultTop h1{font-size:37px;letter-spacing:-.04em;margin:0 0 7px}.resultTop p{margin:0;color:var(--muted)}.score{min-width:88px;height:88px;border-radius:25px;background:var(--deep);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:850}.diagnosis{background:#f3fbdc;border-left:5px solid var(--lime);border-radius:0 15px 15px 0;padding:17px 19px;line-height:1.65;margin-bottom:18px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.tab.active{background:var(--deep);color:#fff}.experiment{border:1px solid var(--line);border-radius:19px;padding:21px;margin-top:8px}.exphead{display:flex;justify-content:space-between;gap:10px}.exphead h2{margin:0 0 7px;font-size:23px}.rank{font-size:12px;font-weight:800;background:#fff1ea;color:#a83f1d;border-radius:99px;padding:7px 10px;height:max-content}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.box{background:#f8faf7;border-radius:14px;padding:15px}.box h3{font-size:13px;margin:0 0 8px}.box p,.box li{font-size:13px;color:var(--muted);line-height:1.6}.box p,.box ul{margin:0}.box ul{padding-left:18px}.wide{grid-column:1/-1}.formula{font-family:ui-monospace,monospace;background:#17382e;color:#dbff78;border-radius:10px;padding:11px;margin-top:7px;font-size:12px}.plan{margin-top:17px}.day{display:grid;grid-template-columns:60px 1fr;gap:10px;border-bottom:1px dashed var(--line);padding:10px 0;font-size:13px}.day b{color:var(--orange)}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}.hidden{display:none}.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:820px){main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}.stage{min-height:auto}}@media(max-width:560px){.shell{padding:14px}.tag{display:none}.stage{padding:25px 19px;border-radius:22px}.title{font-size:40px}.choices,.grid,aside{grid-template-columns:1fr}.wide{grid-column:auto}.resultTop h1{font-size:30px}.score{min-width:70px;height:70px}}
</style></head><body><div class="shell"><header><div class="brand"><span class="mark">GP</span><span>GrowthPilot</span></div><span class="tag">本地生成 · 无需登录 · 数据不上传</span></header><main><section class="stage" id="stage"></section><aside><div class="sidecard"><h3>你将获得</h3><ol><li>3个差异化增长实验</li><li>完整A/B测试与指标口径</li><li>7天启动清单与风险提醒</li></ol></div><div class="sidecard"><h3>适用场景</h3><p>拉新、激活、留存、促活与变现。适合产品、用户运营和增长团队快速形成实验初稿。</p></div></aside></main><footer>GrowthPilot · 把增长想法变成可验证的实验</footer></div>
<script>
const stage=document.querySelector('#stage');
let Q=[
 {key:'goal',q:'这次最想解决哪个增长问题？',h:'先确定漏斗阶段，方案和指标才不会跑偏。',opts:['拉新：获得更多新用户','激活：让新用户完成关键行为','留存：让用户持续回来','促活：召回低活跃用户','变现：提升付费或客单']},
 {key:'audience',q:'你最想影响哪类用户？',h:'描述得越具体，触达方式越可执行。',text:true,ph:'例如：注册7天内、浏览过商品但未下单的用户'},
 {key:'barrier',q:'用户现在为什么没有行动？',h:'选择最接近的核心阻力。',opts:['不知道产品价值','操作路径太长','缺少立即行动的理由','内容或推荐不匹配','担心价格、风险或信任问题']},
 {key:'channel',q:'目前可以使用哪些触达渠道？',h:'选择最主要的渠道，结果中仍会补充协同建议。',opts:['站内入口 / 弹窗','Push / 短信 / 邮件','短视频 / 内容平台','广告投放 / 搜索','社群 / 裂变 / 异业合作']},
 {key:'resource',q:'你的资源和成本空间如何？',h:'GrowthPilot会据此控制实验复杂度。',opts:['低：尽量使用现有资源位','中：可提供小额权益或制作内容','高：可投放、补贴或跨团队协作']},
 {key:'metric',q:'补充周期、现状或目标数字',h:'不知道也没关系，填写希望观察的变化即可。',text:true,ph:'例如：实验14天，目前次日留存18%，希望提升2个百分点'}
];
const baseQ=Q.map(x=>({...x,opts:x.opts?[...x.opts]:undefined}));
function adaptQuestions(goal){
 Q=baseQ.map(x=>({...x,opts:x.opts?[...x.opts]:undefined}));
 const type=goal.split('：')[0],aud=Q[1],bar=Q[2],channel=Q[3],metric=Q[5];
 const variants={
  拉新:{aud:['最希望获取哪类新用户？','描述人群特征、需求或使用场景。','例如：一线城市、正在准备面试的应届毕业生'],bar:['他们为什么还没有成为用户？',['还不知道这个产品','看到了但价值感不强','下载或注册路径太长','缺少可信背书','获客成本过高']],channel:['可以从哪里触达这批新用户？',['短视频 / 内容平台','广告投放 / 搜索','应用商店 / 厂商分发','社群 / 用户裂变','异业合作 / 线下渠道']],metric:['希望在多长时间内获得多少新用户？','例如：测试14天，新增1000名有效用户，CAC控制在30元内']},
  激活:{aud:['哪类新用户没有完成关键行为？','说明注册时间及未完成的动作。','例如：注册3天内、尚未完成首次课程的新用户'],bar:['他们卡在激活路径的哪一步？',['不知道下一步该做什么','首次操作步骤太多','还没感受到核心价值','内容或推荐不匹配','缺少立即完成的动力']],channel:['可以在哪里引导用户完成关键行为？',['新手引导 / 首屏入口','站内弹窗 / 浮层','Push / 短信 / 邮件','任务中心 / 积分体系','客服 / 社群指导']],metric:['关键行为及目标转化率是什么？','例如：7天内完成首节课，目前激活率25%，希望提升3个百分点']},
  留存:{aud:['哪类用户最容易在首次使用后流失？','说明用户阶段和已经发生的行为。','例如：注册7天内、浏览过课程但未完成第一节课的新用户'],bar:['他们为什么没有再次回来？',['首日没有感受到持续价值','操作路径太长','缺少次日回访理由','内容或推荐不匹配','提醒时机或频率不合适']],channel:['可以通过什么方式促成再次访问？',['站内入口 / 待办提醒','Push / 短信 / 邮件','连续任务 / 签到','个性化内容推荐','积分 / 成长体系']],metric:['希望提升哪一周期的留存？','例如：实验14天，目前次日留存18%，希望提升2个百分点']},
  促活:{aud:['需要召回哪类沉默用户？','说明沉默时长和历史价值。','例如：30天未活跃、过去曾购买过会员的用户'],bar:['他们沉默的主要原因可能是什么？',['忘记产品或没有使用场景','现有内容吸引力不足','触达信息与需求不匹配','权益到期后缺少回访理由','对频繁营销产生反感']],channel:['目前还可以怎样触达这些用户？',['Push / 短信 / 邮件','站外广告重定向','社群 / 私域','权益到期提醒','跨产品 / 异业导流']],metric:['召回窗口和目标是什么？','例如：召回30天未活跃用户，活动7天，目标回流率5%']},
  变现:{aud:['哪类用户最接近付费但还没转化？','描述其已有行为和付费意向。','例如：近7天三次进入会员页但未支付的高活跃用户'],bar:['他们没有付费的核心顾虑是什么？',['付费价值不清晰','价格超出预期','套餐选择太复杂','支付路径或时机不合适','缺少信任或售后保障']],channel:['可以在哪个高意向场景促成付费？',['会员页 / 收银台','站内弹窗 / 权益提示','Push / 短信 / 邮件','直播 / 内容场景','客服 / 私域运营']],metric:['当前付费表现和目标是什么？','例如：实验14天，目前付费率3%，希望提升0.5个百分点']}
 }[type];
 if(!variants)return;
 [aud.q,aud.h,aud.ph]=variants.aud;bar.q=variants.bar[0];bar.opts=variants.bar[1];channel.q=variants.channel[0];channel.opts=variants.channel[1];metric.q=variants.metric[0];metric.ph=variants.metric[1];
}
let S={step:0,a:{},topic:''};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function home(){stage.className='stage fade';stage.innerHTML=`<div class="eyebrow">Growth experiment copilot</div><h1 class="title">六步，把增长想法<br>变成可验证实验。</h1><p class="lead">输入你的产品或业务场景，系统将结合目标、用户、阻力、渠道和资源，生成三套增长实验及完整测试方案。</p><div class="benefits"><span>实验假设</span><span>A/B设计</span><span>指标公式</span><span>ICE排序</span><span>执行清单</span></div><div class="inputbox"><textarea id="topic" maxlength="220" placeholder="例如：一款播客App，希望提升新用户的次日留存"></textarea><span class="count"><b id="n">0</b>/220</span></div><div class="actions"><button class="primary" id="start" disabled>开始设计实验</button><button class="secondary" id="demo">填入演示案例</button><button class="ghost" id="history">历史方案</button></div>`;let t=stage.querySelector('#topic'),b=stage.querySelector('#start');t.oninput=()=>{stage.querySelector('#n').textContent=t.value.length;b.disabled=t.value.trim().length<8};stage.querySelector('#demo').onclick=()=>{t.value='一款播客App，希望提升新用户的次日留存，但可用预算有限';t.oninput()};b.onclick=()=>{S={step:0,a:{},topic:t.value.trim()};ask()};stage.querySelector('#history').onclick=history}
function ask(){let x=Q[S.step];stage.className='stage fade';stage.innerHTML=`<div class="stepmeta"><span>信息收集 ${S.step+1} / ${Q.length}</span><span>${Math.round(S.step/Q.length*100)}%</span></div><div class="steps">${Q.map((_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('')}</div><h2 class="question">${x.q}</h2><p class="hint">${x.h}</p>${x.text?`<div class="inputbox"><textarea id="ans" maxlength="260" placeholder="${x.ph}">${esc(S.a[x.key]||'')}</textarea><span class="count"><b id="n">${(S.a[x.key]||'').length}</b>/260</span></div>`:`<div class="choices">${x.opts.map(o=>`<button class="choice ${S.a[x.key]===o?'selected':''}" data-v="${o}">${o}</button>`).join('')}</div>`}<div class="actions"><button class="primary" id="next" ${S.a[x.key]?'':'disabled'}>${S.step===Q.length-1?'生成增长方案':'继续'}</button>${S.step?'<button class="ghost" id="back">上一步</button>':''}</div>`;let value=S.a[x.key]||'';if(x.text){let a=stage.querySelector('#ans');a.oninput=()=>{value=a.value.trim();stage.querySelector('#n').textContent=a.value.length;stage.querySelector('#next').disabled=value.length<3}}else stage.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{stage.querySelectorAll('.choice').forEach(v=>v.classList.remove('selected'));btn.classList.add('selected');value=btn.dataset.v;stage.querySelector('#next').disabled=false});stage.querySelector('#next').onclick=()=>{S.a[x.key]=value;S.step++;S.step<Q.length?ask():result()};let back=stage.querySelector('#back');if(back)back.onclick=()=>{S.step--;ask()}}
function build(){let a=S.a,goal=a.goal.split('：')[0],low=a.resource.startsWith('低'),bar=a.barrier,channel=a.channel;let bank={拉新:[['低门槛首触达','降低首次接触成本，用清晰利益点引导注册或下载'],['老带新双向激励','让现有用户成为分发节点，并限制无效邀请'],['内容场景承接','用高相关内容吸引目标人群并缩短落地页链路']],激活:[['关键行为引导','把核心价值提前到首个会话中'],['新手任务阶梯','用渐进任务推动用户完成关键行为'],['个性化首屏','根据用户意图调整首屏内容与入口']],留存:[['次日价值预埋','在首日结束前为用户制造次日回访理由'],['个性化内容续接','记录首日偏好并在次日提供连续体验'],['轻量成长反馈','让用户看见已获得的进度与权益']],促活:[['分层召回','按沉默时长和历史价值配置不同触达'],['未完成行为提醒','用用户已有行为而非泛化优惠做召回理由'],['限时权益测试','对高意向用户测试小额限时权益']],变现:[['付费价值前置','先让用户体验核心价值，再呈现付费点'],['套餐锚点优化','通过套餐结构与推荐标识降低选择成本'],['高意向场景促转','在最接近付费的行为节点提供个性化权益']]};let base=bank[goal]||bank.留存;return base.map((e,i)=>({name:e[0],idea:e[1],ice:Math.max(62,88-i*8-(low&&i===1?6:0)),hyp:`如果面向${a.audience}，通过${e[1]}，可以缓解“${bar}”，从而提升${goal}表现。`,control:'保持现有产品链路和触达策略',test:`通过${channel}上线${e[0]}方案；${low?'优先复用现有资源位，不新增大额补贴':'配置独立素材与小流量权益'}`,metric:goal==='留存'?'次日留存率 = 次日仍活跃的新用户数 ÷ 当日新增用户数':goal==='拉新'?'有效获客成本 = 渠道成本 ÷ 完成关键行为的新用户数':goal==='变现'?'付费转化率 = 付费用户数 ÷ 进入付费场景用户数':'关键行为转化率 = 完成关键行为用户数 ÷ 进入实验用户数',risk:i===0?'注意自然波动与同期活动干扰':i===1?'监控激励作弊和高成本用户占比':'避免触达频次过高造成用户反感'}))}
function result(active=0){let exps=build(),e=exps[active],a=S.a,goal=a.goal.split('：')[0];stage.className='stage fade';stage.innerHTML=`<div class="resultTop"><div><div class="eyebrow">Experiment brief</div><h1>${goal}实验方案</h1><p>${esc(S.topic)} · ${esc(a.metric)}</p></div><div class="score">${e.ice}<small>/100</small></div></div><div class="diagnosis"><b>问题诊断：</b>目标用户是“${esc(a.audience)}”，主要阻力为“${esc(a.barrier)}”。建议先用${esc(a.resource)}的方式验证关键假设，再决定是否扩大投入。</div><div class="tabs">${exps.map((x,i)=>`<button class="tab ${i===active?'active':''}" data-i="${i}">方案${i+1} · ${x.name}</button>`).join('')}</div><div class="experiment"><div class="exphead"><div><h2>${e.name}</h2><span class="pill">推荐渠道：${esc(a.channel)}</span></div><span class="rank">ICE ${e.ice}</span></div><div class="grid"><div class="box wide"><h3>实验假设</h3><p>${esc(e.hyp)}</p></div><div class="box"><h3>对照组</h3><p>${e.control}</p></div><div class="box"><h3>实验组</h3><p>${esc(e.test)}</p></div><div class="box"><h3>核心指标</h3><p>${goal}主指标</p><div class="formula">${e.metric}</div></div><div class="box"><h3>护栏指标与风险</h3><ul><li>页面退出率 / 退订率</li><li>单位用户成本</li><li>${e.risk}</li></ul></div></div><div class="plan"><h3>7天启动清单</h3><div class="day"><b>Day 1</b><span>确认实验人群、核心指标和数据口径</span></div><div class="day"><b>Day 2</b><span>完成实验与对照组分流，准备页面或触达素材</span></div><div class="day"><b>Day 3</b><span>小流量上线，检查埋点、曝光和异常数据</span></div><div class="day"><b>Day 4–6</b><span>持续观测主指标、成本和护栏指标，不提前下结论</span></div><div class="day"><b>Day 7</b><span>复盘结果，决定扩大、迭代或停止实验</span></div></div></div><div class="actions"><button class="primary" id="copy">复制方案</button><button class="secondary" id="download">下载报告</button><button class="ghost" id="save">保存到历史</button><button class="ghost" id="again">重新填写</button></div>`;stage.querySelectorAll('.tab').forEach(b=>b.onclick=()=>result(+b.dataset.i));stage.querySelector('#again').onclick=home;let report=()=>`GrowthPilot 增长实验方案\n业务：${S.topic}\n目标：${a.goal}\n用户：${a.audience}\n方案：${e.name}\n假设：${e.hyp}\n对照组：${e.control}\n实验组：${e.test}\n指标：${e.metric}\n周期：${a.metric}`;stage.querySelector('#copy').onclick=async ev=>{await navigator.clipboard.writeText(report());ev.target.textContent='已复制'};stage.querySelector('#download').onclick=()=>{let blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='GrowthPilot增长实验方案.txt';l.click();URL.revokeObjectURL(u)};stage.querySelector('#save').onclick=ev=>{let arr=JSON.parse(localStorage.getItem('gpHistory')||'[]');arr.unshift({date:new Date().toLocaleString(),topic:S.topic,state:S});localStorage.setItem('gpHistory',JSON.stringify(arr.slice(0,8)));ev.target.textContent='已保存'}}

const askCore=ask;
ask=function(){if(S.step===1&&S.a.goal)adaptQuestions(S.a.goal);return askCore()};
function inferGoal(topic){
 const rules=[['变现',['付费','会员','客单','收入','购买']],['促活',['沉默','召回','流失','回流']],['留存',['留存','次日','七日','复购','持续','再次']],['激活',['激活','首次','关键行为','完成第一']],['拉新',['拉新','新增','获客','下载','注册']]];
 for(const [goal,words] of rules)if(words.some(w=>topic.includes(w)))return goal;
 return '';
}
function smartAsk(){
 if(S.step===1&&S.a.goal)adaptQuestions(S.a.goal);
 let x=Q[S.step],recommended=S.step===0?inferGoal(S.topic):'',old=S.a[x.key]||'',multi=x.key==='channel';
 if(recommended)x.h=`根据你的问题描述，系统初步推荐“${recommended}”。你也可以选择其他目标。`;
 stage.className='stage fade';
 const chosen=multi?String(old).split(' + ').filter(Boolean):[old];
 stage.innerHTML=`<div class="stepmeta"><span>信息收集 ${S.step+1} / ${Q.length}</span><span>${Math.round(S.step/Q.length*100)}%</span></div><div class="steps">${Q.map((_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('')}</div><h2 class="question">${x.q}</h2><p class="hint">${x.h}${multi?'（最多选择3项）':''}</p>${x.text?`<div class="inputbox"><textarea id="ans" maxlength="260" placeholder="${x.ph}">${esc(old)}</textarea><span class="count"><b id="n">${old.length}</b>/260</span></div>`:`<div class="choices">${x.opts.map(o=>{let rec=recommended&&o.startsWith(recommended);return `<button class="choice ${chosen.includes(o)?'selected':''}" data-v="${o}">${o}${rec?'<br><small style="color:#ff7849;font-weight:800">系统推荐</small>':''}</button>`}).join('')}</div>`}<div class="actions"><button class="primary" id="next" ${old?'':'disabled'}>${S.step===Q.length-1?'生成增长方案':'继续'}</button>${S.step?'<button class="ghost" id="back">上一步</button>':''}</div>`;
 let value=old;
 if(x.text){let a=stage.querySelector('#ans');a.oninput=()=>{value=a.value.trim();stage.querySelector('#n').textContent=a.value.length;stage.querySelector('#next').disabled=value.length<3}}
 else if(multi){let picks=[...chosen];stage.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{let v=btn.dataset.v,i=picks.indexOf(v);if(i>=0){picks.splice(i,1);btn.classList.remove('selected')}else if(picks.length<3){picks.push(v);btn.classList.add('selected')}value=picks.join(' + ');stage.querySelector('#next').disabled=!picks.length})}
 else stage.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{stage.querySelectorAll('.choice').forEach(v=>v.classList.remove('selected'));btn.classList.add('selected');value=btn.dataset.v;stage.querySelector('#next').disabled=false});
 stage.querySelector('#next').onclick=()=>{S.a[x.key]=value;S.step++;S.step<Q.length?smartAsk():result()};
 let back=stage.querySelector('#back');if(back)back.onclick=()=>{S.step--;smartAsk()};
}
ask=smartAsk;
const buildBase=build;
build=function(){
 const plans=buildBase(),low=S.a.resource&&S.a.resource.startsWith('低');
 const routes=[
  {route:'低成本验证',impact:7,confidence:8,ease:9,why:'优先复用现有资源位，以最低成本验证核心假设'},
  {route:'激励驱动',impact:8,confidence:7,ease:low?5:7,why:'通过限时权益增强立即行动理由，同时监控激励成本'},
  {route:'个性化触达',impact:9,confidence:6,ease:5,why:'利用用户行为和偏好分层触达，潜在影响更高但实施更复杂'}
 ];
 return plans.map((p,i)=>{let r=routes[i],score=Math.round((r.impact+r.confidence+r.ease)/3*10);return {...p,...r,ice:score,name:`${r.route}｜${p.name}`,test:i===0?`复用现有资源完成最小实验：${p.test}`:i===1?`增加小额积分、优惠券或限时权益：${p.test}`:`按用户行为或偏好分层：${p.test}`}});
};
